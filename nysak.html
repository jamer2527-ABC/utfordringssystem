<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Ny sak — Utfordringssystem</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', sans-serif; background:#f0f2f5; }
    nav { background:#4f46e5; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; }
    nav h1 { color:white; font-size:1.1rem; }
    a { color:white; font-size:0.9rem; }
    .container { max-width:600px; margin:2rem auto; padding:0 1rem; }
    .kort { background:white; border-radius:12px; padding:2rem; box-shadow:0  1px 4px rgba(0,0,0,0.07); }
    h2 { font-size:1.2rem; color:#1a1a2e; margin-bottom:1.5rem; }
    label { font-size:0.85rem; color:#444; display:block; margin-bottom:4px; margin-top:1rem; }
    input, textarea, select { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; font-family:'Segoe UI',sans-serif; }
    input:focus, textarea:focus, select:focus { outline:none; border-color:#4f46e5; }
    textarea { height:120px; resize:vertical; }
    .knapper { display:flex; gap:12px; margin-top:1.5rem; }
    .send-btn { flex:1; padding:11px; background:#4f46e5; color:white; border:none; border-radius:8px; font-size:1rem; cursor:pointer; }
    .send-btn:hover { background:#4338ca; }
    .avbryt-btn { flex:1; padding:11px; background:#f0f2f5; color:#444; border:1px solid #ddd; border-radius:8px; font-size:1rem; cursor:pointer; }
    .avbryt-btn:hover { background:#e5e7eb; }
    .suksess { display:none; background:#d1fae5; color:#065f46; padding:1rem; border-radius:8px; margin-top:1rem; text-align:center; font-weight:600; }
  </style>
</head>
<body>
  <nav>
    <h1>Utfordringssystem</h1>
    <a href="saker.html">← Tilbake</a>
  </nav>
  <div class="container">
    <div class="kort">
      <h2>Registrer ny utfordring</h2>
      <label>Tittel</label>
      <input type="text" id="tittel" placeholder="Kort beskrivelse av utfordringen" />
      <label>Kategori (alvorlighetsgrad)</label>
      <select id="kategori">
        <option value="kritisk">🔴 Kritisk — blokkerer læring helt</option>
        <option value="viktig">🟡 Viktig — påvirker læring betydelig</option>
        <option value="lav">🟢 Lav — mindre problem</option>
      </select>
      <label>Beskrivelse</label>
      <textarea id="beskrivelse" placeholder="Beskriv utfordringen i detalj..."></textarea>
      <div class="knapper">
        <button class="avbryt-btn" onclick="window.location.href='saker.html'">Avbryt</button>
        <button class="send-btn" onclick="sendSak()">Send inn sak</button>
      </div>
      <div class="suksess" id="suksess">✅ Saken er registrert! Lærer vil svare snart.</div>
    </div>
  </div>
  <script>
    async function sendSak() {
    const tittel = document.getElementById('tittel').value.trim();
    const beskrivelse = document.getElementById('beskrivelse').value.trim();
    const kategori = document.getElementById('kategori').value;
    if (!tittel || !beskrivelse) {
      alert('Fyll inn tittel og beskrivelse!');
      return;
    }
    const svar = await fetch('/api/nysak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ elevId: 1, tittel, beskrivelse, kategori })
    });
    const data = await svar.json();
    if (data.status === 'ok') {
      document.getElementById('suksess').style.display = 'block';
      setTimeout(() => window.location.href = 'saker.html', 2000);
    } else {
      alert('Feil: ' + data.melding);
    }
  }
  </script>
</body>
</html>
