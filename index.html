<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Logg inn — Utfordringssystem</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', sans-serif; background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh; }
    .kort { background:white; padding:2rem; border-radius:12px; width:360px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
    h1 { font-size:1.4rem; margin-bottom:0.3rem; color:#1a1a2e; }
    p { font-size:0.85rem; color:#666; margin-bottom:1.5rem; }
    label { font-size:0.85rem; color:#444; display:block; margin-bottom:4px; }
    input { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; margin-bottom:1rem; }
    input:focus { outline:none; border-color:#4f46e5; }
    button { width:100%; padding:11px; background:#4f46e5; color:white; border:none; border-radius:8px; font-size:1rem; cursor:pointer; }
    button:hover { background:#4338ca; }
    .rolle { display:flex; gap:8px; margin-bottom:1rem; }
    .rolle button { background:#f0f2f5; color:#444; font-size:0.85rem; padding:8px; flex:1; border-radius:8px; border:1px solid #ddd; }
    .rolle button.aktiv { background:#4f46e5; color:white; border-color:#4f46e5; }
  </style>
</head>
<body>
  <div class="kort">
    <h1>Utfordringssystem</h1>
    <p>Logg inn for å fortsette</p>
    <div class="rolle">
      <button class="aktiv" onclick="velgRolle(this)">Elev</button>
      <button onclick="velgRolle(this)">Lærer</button>
      <button onclick="velgRolle(this)">Admin</button>
    </div>
    <label>Brukernavn</label>
    <input type="text" placeholder="brukernavn" />
    <label>Passord</label>
    <input type="password" placeholder="••••••••" />
    <button onclick="loggInn()">Logg inn</button>
  </div>
  <script>
    function velgRolle(el) {
    document.querySelectorAll('.rolle button').forEach(b => b.classList.remove('aktiv'));
    el.classList.add('aktiv');
  }

  async function loggInn() {
    const brukernavn = document.querySelector('input[type="text"]').value;
    const passord = document.querySelector('input[type="password"]').value;

    const svar = await fetch('/api/logginn', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ brukernavn, passord })
    });

    const data = await svar.json();

    if (data.status === 'ok') {
      if (data.rolle === 'laerer') window.location.href = 'laerer.html';
      else if (data.rolle === 'admin') window.location.href = 'admin.html';
      else window.location.href = 'saker.html';
    } else {
      alert('Feil brukernavn eller passord!');
    }
  }
  </script>
</body>
</html>
